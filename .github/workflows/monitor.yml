name: Gold Rates Monitor

permissions:
  contents: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [check-rates]

concurrency:
  group: gold-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run monitor with retry
        id: monitor
        run: |
          success=0
          for i in {1..3}; do
            if python monitor_gold.py; then
              success=1
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 10
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "Monitor failed after 3 attempts"
            exit 1
          fi
      
      - name: Update README
        if: steps.monitor.outputs.rates_changed == 'true'
        run: python update_readme.py

      - name: Commit and push if changed
        if: steps.monitor.outputs.rates_changed == 'true'
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "📊 Rates updated: $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M IST')"
            # Another run may have pushed in the meantime. Every data file is
            # regenerated each run, so on a conflict drop this commit; the
            # next run (5 min) picks up from the newer state.
            if ! git pull --rebase -q; then
              git rebase --abort || true
              echo "Newer run already pushed; skipping this commit"
              echo "changed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Only Kerala feeds the webapp today; a state-only change must not
      # re-write rates/kerala_rates_1.
      - name: Sync rates to Firestore via webhook
        if: steps.commit.outputs.changed == 'true' && steps.monitor.outputs.kerala_changed == 'true'
        run: |
          for i in 1 2; do
            HTTP_STATUS=$(curl -s -o /tmp/webhook_resp.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-webhook-secret: ${{ secrets.GITACTIONS_WEBHOOK_SECRET }}" \
              "${{ secrets.WEBAPP_WEBHOOK_URL }}")

            echo "Attempt $i — HTTP $HTTP_STATUS: $(cat /tmp/webhook_resp.json)"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Rates synced to Firestore"
              exit 0
            fi

            [ $i -lt 2 ] && sleep 10
          done
          echo "⚠️ Webhook failed after 2 attempts — continuing"

      # Starter shops get today's poster made the moment their state's rate changes.
      # Kerala's are made by the webhook above, after it writes the Kerala rate.
      - name: Make Starter posters for states with a new rate
        if: steps.commit.outputs.changed == 'true' && steps.monitor.outputs.rate_states != ''
        run: |
          URL="${{ secrets.WEBAPP_WEBHOOK_URL }}"
          URL="${URL%/api/github-webhook}/api/state-rates-webhook"
          # Send the fresh file: GitHub's raw CDN can serve the old one for a few minutes.
          python -c "import json,sys; d=json.load(open('state_rates.json', encoding='utf-8')); print(json.dumps({'changed': sys.argv[1].split(','), 'states': d['states']}))" "${{ steps.monitor.outputs.rate_states }}" > /tmp/state_body.json
          HTTP_STATUS=$(curl -s --max-time 280 -o /tmp/state_resp.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ secrets.GITACTIONS_WEBHOOK_SECRET }}" \
            --data @/tmp/state_body.json \
            "$URL") || true
          echo "HTTP $HTTP_STATUS: $(cat /tmp/state_resp.json 2>/dev/null)"
